<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs><rect width="64" height="64" fill="url(#bg)"/><g transform="translate(32 32) scale(0.72) translate(-32 -32)">
  <!-- base -->
  
  
  <!-- anel da bússola -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <!-- marcadores -->
  <g fill="#ffffff" fill-opacity="0.6">
    <circle cx="32" cy="9.5" r="1.3"/><circle cx="32" cy="54.5" r="1.3"/>
    <circle cx="9.5" cy="32" r="1.3"/><circle cx="54.5" cy="32" r="1.3"/>
  </g>
  <!-- agulha / cristal -->
  <g filter="url(#glow)">
    <polygon points="32,13 38,32 32,27 26,32" fill="url(#needle)"/>
    <polygon points="32,51 26,32 32,37 38,32" fill="#ffffff" fill-opacity="0.45"/>
  </g>
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
  <circle cx="32" cy="32" r="3" fill="none" stroke="#7c3aed" stroke-width="1"/>
</g></svg>